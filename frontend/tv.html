
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: #5c5c5c;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.tv-container {
    display: flex;
    width: 95vw;
    height: 90vh;
    gap: 18px;
}

.left-panel {
    display: flex;
    flex-direction: column;
    width: 35%;
    gap: 18px;
}

.rigth-panel {
    display: flex;
    flex-direction: column;
    width: 65%;
    gap: 18px;
}

.box {
    background-color: rgb(64, 164, 247);
    border: 6px solid rgb(4, 52, 172);
    border-radius: 15px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 4px 15px black;
    min-width: 0;
}

.box-title {
    color: aliceblue;
    font-size: 2.2vw;
    font-weight: bold;
    text-transform: uppercase;
    text-shadow: 1px 1px 2px black;
    margin-bottom: 12px;
}

/* Painel esquerdo */
.local-box {
    flex: 1;
}

.local-number {
    color: rgb(250, 246, 246);
    font-size: 9vw;
    font-weight: bold;
    line-height: 1;
}

.local-type {
    color: #5c5c5c;
    font-size: 1.8vw;
    font-weight: bold;
    margin-top: 6px;
}

.history-box {
    flex: 1;
    justify-content: center;
    align-items: center;
}

.history-box .box-title {
    font-size: 1.8vw;
    align-self: center;
}

#history-list {
    list-style: none;
    width: 100%;
    color: rgb(5, 80, 219);
    font-size: 1.5vw;
    font-weight: bold;
    text-align: left;
}

#history-list li {
    margin-bottom: 8px;
    border-bottom: 1px solid grey;
    padding-bottom: 5px;
    overflow-wrap: anywhere;
}

/* Painel direito */
.patient-box {
    flex: 3;
}

.patient-name {
    color: rgb(3, 31, 135);
    font-size: 6.5vw;
    font-weight: bold;
    line-height: 1.2;
    overflow-wrap: anywhere;
}

/* Logo */
.logo-box {
    flex: 1;
}

.logo-text {
    color: rgb(253, 253, 253);
    font-size: 3.5vw;
    font-weight: bold;
    text-transform: uppercase;
}

/* Animação de chamada */
@keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.flash {
    animation: flash 0.5s ease 3;
}
</style>

<title>Midia Indoor - TV</title>
</head>

<body>

<div class="tv-container">

    <div class="left-panel">

        <div class="box local-box">
            <div class="box-title" id="local-tipo">GUICHÊ</div>
            <div class="local-number" id="local-numero">---</div>
        </div>

        <div class="box history-box">
            <div class="box-title">ÚLTIMAS CHAMADAS</div>
            <ul id="history-list"></ul>
        </div>

    </div>

    <div class="rigth-panel">

        <div class="box patient-box">
            <div class="box-title">PACIENTE</div>
            <div class="patient-name" id="patient-name">
                AGUARDANDO...
            </div>
        </div>

        <div class="box logo-box">
            <div class="logo-text">🏥 Sistema hospitalar</div>
        </div>

    </div>

</div>

<script>
let ultimold = null;

// Atualiza a chamada e o histórico da TV
async function atualizar() {
    try {
        const resposta = await fetch("/tv/chamado");

        if (!resposta.ok) {
            throw new Error("Erro HTTP: " + resposta.status);
        }

        const data = await resposta.json();

        const chamada = data.chamada;
        const historico = data.historico || [];

        if (chamada) {
            document.getElementById("local-tipo").innerText =
                chamada.localTipo || "GUICHÊ";

            document.getElementById("local-numero").innerText =
                chamada.localNumero ?? "---";

            document.getElementById("patient-name").innerText =
                chamada.paciente || "AGUARDANDO...";

            // Animação quando houver uma nova chamada
            if (chamada.id !== ultimold) {
                ultimold = chamada.id;

                const patientBox =
                    document.querySelector(".patient-box");

                patientBox.classList.remove("flash");

                void patientBox.offsetWidth;

                patientBox.classList.add("flash");
            }
        }

        // Atualiza o histórico
        const list = document.getElementById("history-list");

        list.innerHTML = "";

        historico.slice(0, 4).forEach(h => {
            const li = document.createElement("li");

            const tipo = h.localTipo
                ? h.localTipo.substring(0, 4)
                : "GUIC";

            li.innerText =
                `${tipo}. ${h.localNumero ?? "---"} - ${h.paciente || "Paciente"}`;

            list.appendChild(li);
        });

    } catch (err) {
        console.error("Erro ao buscar chamada:", err);
    }
}

atualizar();
setInterval(atualizar, 2000);
</script>

</body>
</html>
