
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem</title>
<link rel="stylesheet" href="css/style.css">

<style>
  .btn-tv {
    background: #28a745;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;
  }

  .btn-tv:hover {
    background: rgb(3, 68, 6);
  }

  .paciente-fila {
    margin-bottom: 30px;
    background: white;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid white;
  }

  .paciente-fila h3 {
    margin-top: 0;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .paciente-fila h3 span {
    font-size: 13px;
    font-weight: normal;
    color: #666;
  }

  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: white;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #dce4ff;
  }

  .fila-item strong {
    font-size: 15px;
  }

  .fila-item small {
    color: #888;
    font-size: 12px;
  }

  .btn-abrir-tv {
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }

  .btn-abrir-tv:hover {
    background: #117a8b;
  }
</style>
</head>

<body>
<div class="container">

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">

    <h2 style="margin:0;">🏥 Triagem Hospitalar</h2>

    <button
      class="btn-abrir-tv"
      type="button"
      onclick="window.open('tv.html', '_blank')">
      📺 abrir tela da tv
    </button>

  </div>

  <div class="paciente-file">
    <h3>Paciente cadastrado no CPF</h3>

    <div id="file-paciente">
      <p style="color:#888; text-align:center;">
        Carregando...
      </p>
    </div>

    <button
      type="button"
      onclick="carregandoPaciente()"
      style="margin-top:8px; background-color:#6c757d; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">
      Atualizar lista
    </button>
  </div>

  <h2>🏥 Triagem Hospitalar</h2>

  <input id="nome" placeholder="Nome">

  <select id="sintoma">
    <option value="">Selecione o sintoma</option>
    <option value="dor_leve">Dor leve</option>
    <option value="resfriado">Resfriado</option>
    <option value="coriza">Coriza</option>
    <option value="tosse">Tosse</option>
    <option value="febre">Febre</option>
    <option value="vomito">Vômito</option>
    <option value="diarreia">Diarreia</option>
    <option value="falta_ar_moderada">Falta de ar moderada</option>
    <option value="falta_ar_grave">Falta de ar grave</option>
    <option value="infarto">Suspeita de infarto</option>
    <option value="avc">Suspeita de AVC</option>
    <option value="convulsao">Convulsão</option>
    <option value="hemorragia">Hemorragia</option>
  </select>

  <input
    id="temp"
    type="number"
    step="0.1"
    placeholder="Temperatura °C">

  <input id="alergia" placeholder="Alergias">

  <textarea id="observacao" placeholder="Observações"></textarea>

  <div id="resultado"></div>

  <button type="button" onclick="salvar()">
    Salvar Triagem
  </button>

</div>

<script>
  function classificarRisco(sintoma, temperatura) {
    const vermelhos = [
      "infarto",
      "avc",
      "convulsao",
      "hemorragia",
      "falta_ar_grave"
    ];

    const amarelos = [
      "febre",
      "vomito",
      "diarreia",
      "falta_ar_moderada"
    ];

    if (temperatura >= 39) {
      return "vermelho";
    }

    if (vermelhos.includes(sintoma)) {
      return "vermelho";
    }

    if (amarelos.includes(sintoma)) {
      return "amarelo";
    }

    return "verde";
  }

  async function salvar() {
    const nome = document.getElementById("nome").value.trim();
    const sintoma = document.getElementById("sintoma").value;
    const temperaturaTexto = document.getElementById("temp").value.trim();
    const temperatura = Number(temperaturaTexto);
    const alergia = document.getElementById("alergia").value.trim();
    const observacao = document.getElementById("observacao").value.trim();

    if (!nome) {
      alert("Digite o nome do paciente.");
      return;
    }

    if (!sintoma) {
      alert("Selecione um sintoma.");
      return;
    }

    if (
      temperaturaTexto === "" ||
      !Number.isFinite(temperatura)
    ) {
      alert("Informe uma temperatura válida.");
      return;
    }

    const risco = classificarRisco(sintoma, temperatura);

    try {
      const resposta = await fetch("/triagem", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          nome,
          sintoma,
          temperatura,
          alergia,
          observacao,
          risco
        })
      });

      if (!resposta.ok) {
        const mensagem = await resposta.text();
        throw new Error(mensagem || "Erro ao salvar a triagem.");
      }

      const resultado = document.getElementById("resultado");
      resultado.className = risco;
      resultado.textContent = "Classificação: " + risco.toUpperCase();

      alert("Triagem salva!");

      document.getElementById("nome").value = "";
      document.getElementById("sintoma").value = "";
      document.getElementById("temp").value = "";
      document.getElementById("alergia").value = "";
      document.getElementById("observacao").value = "";

      await carregandoPaciente();

    } catch (error) {
      console.error("Erro ao salvar triagem:", error);
      alert("Erro ao salvar a triagem. Verifique se o servidor está funcionando.");
    }
  }

  async function carregandoPaciente() {
    const div = document.getElementById("file-paciente");

    try {
      const resposta = await fetch("/pacientes");

      if (!resposta.ok) {
        throw new Error("Erro ao buscar pacientes.");
      }

      const pacientes = await resposta.json();

      if (!Array.isArray(pacientes)) {
        throw new Error("A resposta de pacientes é inválida.");
      }

      const fila = pacientes.filter(
        p => p.status === "triagem"
      );

      div.innerHTML = "";

      if (fila.length === 0) {
        const mensagem = document.createElement("p");
        mensagem.style.color = "#888";
        mensagem.style.textAlign = "center";
        mensagem.textContent = "Nenhum paciente aguardando.";
        div.appendChild(mensagem);
        return;
      }

      fila.forEach(p => {
        const item = document.createElement("div");
        item.className = "fila-item";

        const informacoes = document.createElement("div");

        const nome = document.createElement("strong");
        nome.textContent = p.nome || "Nome não informado";

        const detalhes = document.createElement("small");
        detalhes.textContent =
          "CPF: " + (p.cpf || "-") +
          " | Tipo: " + (p.tipo || "-");

        informacoes.append(
          nome,
          document.createElement("br"),
          detalhes
        );

        const botao = document.createElement("button");
        botao.type = "button";
        botao.className = "btn-tv";
        botao.textContent = "Chamar na TV";

        botao.addEventListener("click", () => {
          chamarNaTv(p.nome);
        });

        item.append(informacoes, botao);
        div.appendChild(item);
      });

    } catch (error) {
      console.error("Erro ao carregar pacientes:", error);
      div.textContent = "Erro ao carregar pacientes.";
    }
  }

  
async function chamarNaTv(nome) {
  try {
    const resposta = await fetch("/tv/chamar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nome: nome,
        localTipo: "GUICHÊ",
        localNumero: "01"
      })
    });

    if (!resposta.ok) {
      throw new Error("O servidor não confirmou a chamada.");
    }

    alert("Paciente chamado na TV!");

  } catch (error) {
    console.error("Erro ao chamar paciente na TV:", error);
    alert("Erro ao chamar paciente na TV. Verifique o servidor.");
  }
}

  
  // Carregar pacientes ao abrir a página
  carregandoPaciente();

  // Atualizar a lista automaticamente a cada 10 segundos
  setInterval(carregandoPaciente, 10000);
</script>

</body>
</html>
