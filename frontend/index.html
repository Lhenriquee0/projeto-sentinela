
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Sistema Hospitalar</title>
</head>
<body>

<img src="/img/logo do hospital.png" alt="Logo do hospital">

<div class="container">
  <h2>Sistema Hospitalar</h2>
  <input id="usuario" type="text" placeholder="Usuário" required>
  <input id="senha" type="password" placeholder="Senha" required>
  <button onclick="login()">Entrar</button>
</div>

<script>
async function login() {
  const usuario = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value;

  if (!usuario || !senha) {
    alert("Preencha o usuário e a senha.");
    return;
  }

  try {
    const resposta = await fetch("http://localhost:3000/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        usuario: usuario,
        senha: senha
      })
    });

    const data = await resposta.json();

    if (!resposta.ok) {
      throw new Error(data.erro || data.error || "Usuário ou senha inválidos.");
    }

    if (data.tipo === "triagem") {
      window.location.href = "triagem.html";
    } else if (data.tipo === "medico") {
      window.location.href = "medico.html";
    } else if (data.tipo === "atendimento") {
      window.location.href = "atendimento.html";
    } else {
      alert("Tipo de usuário não reconhecido.");
    }

  } catch (erro) {
    console.error("Erro no login:", erro);
    alert("Não foi possível realizar o login. Verifique suas credenciais e se o servidor está funcionando.");
  }
}

// Atalho: Ctrl + Alt + A abre admin.html
window.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "a") {
    e.preventDefault();
    window.location.href = "admin.html";
  }
});
</script>

</body>
</html>
